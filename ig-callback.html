<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Conectando con Clipeados Studio</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;max-width:560px;margin:60px auto;padding:0 16px;color:#111;background:#fff}</style></head>
<body><p id="m">Volviendo a Clipeados Studio…</p>
<script>
// Instagram no admite localhost como Redirect URI: esta página reenvía la respuesta a la app local.
(function () {
  var q = new URLSearchParams(location.search), out = new URLSearchParams();
  ["code", "state", "error", "error_reason", "error_description"].forEach(function (k) { if (q.has(k)) out.set(k, q.get(k)); });
  if (!out.has("state")) { document.getElementById("m").textContent = "Falta información de Instagram. Vuelve a pulsar «Conectar Instagram» en la app."; return; }
  location.replace("http://localhost:8000/api/instagram/callback?" + out.toString());
})();
</script></body></html>
